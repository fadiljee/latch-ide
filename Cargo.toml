[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/store",
  "crates/git-engine",
  "crates/pty-pool",
  "crates/sandbox",
  "crates/proxy",
  "crates/dag",
  "crates/fs-service",
  "crates/search",
  "crates/lsp-host",
  "crates/agent-proto",
  "crates/workbench-api",
  "crates/daemon",
  "crates/tui",
  "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
latch-core = { path = "crates/core" }
latch-store = { path = "crates/store" }
latch-git-engine = { path = "crates/git-engine" }
latch-pty-pool = { path = "crates/pty-pool" }
latch-sandbox = { path = "crates/sandbox" }
latch-proxy = { path = "crates/proxy" }
latch-dag = { path = "crates/dag" }
latch-fs-service = { path = "crates/fs-service" }
latch-search = { path = "crates/search" }
latch-lsp-host = { path = "crates/lsp-host" }
latch-agent-proto = { path = "crates/agent-proto" }
latch-workbench-api = { path = "crates/workbench-api" }
latch-daemon = { path = "crates/daemon" }
latch-tui = { path = "crates/tui" }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
vt100 = "0.15"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
base64 = "0.22"
proptest = "1"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = "s"
