[workspace]
resolver = "2"
exclude = ["desktop"]
members = [
  "crates/core",
  "crates/store",
  "crates/git-engine",
  "crates/pty-pool",
  "crates/sandbox",
  "crates/proxy",
  "crates/dag",
  "crates/fs-service",
  "crates/search",
  "crates/lsp-host",
  "crates/agent-proto",
  "crates/workbench-api",
  "crates/daemon",
  "crates/tui",
  "cli",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
latch-core = { version = "1.4.0", path = "crates/core" }
latch-store = { version = "1.4.0", path = "crates/store" }
latch-git-engine = { version = "1.4.0", path = "crates/git-engine" }
latch-pty-pool = { version = "1.4.0", path = "crates/pty-pool" }
latch-sandbox = { version = "1.4.0", path = "crates/sandbox" }
latch-proxy = { version = "1.4.0", path = "crates/proxy" }
latch-dag = { version = "1.4.0", path = "crates/dag" }
latch-fs-service = { version = "1.4.0", path = "crates/fs-service" }
latch-search = { version = "1.4.0", path = "crates/search" }
latch-lsp-host = { version = "1.4.0", path = "crates/lsp-host" }
latch-agent-proto = { version = "1.4.0", path = "crates/agent-proto" }
latch-workbench-api = { version = "1.4.0", path = "crates/workbench-api" }
latch-daemon = { version = "1.4.0", path = "crates/daemon" }
latch-tui = { version = "1.4.0", path = "crates/tui" }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
tracing-appender = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
portable-pty = "0.8"
vt100 = "0.15"
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "ws", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
rust-embed = { version = "8", default-features = false }
hmac = "0.12"
landlock = "0.4"
sha2 = "0.10"
subtle = "2"
proptest = "1"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = "s"
