name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl-release:
    name: Build & Publish Static Musl Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install musl-tools, clang & lld
        run: sudo apt-get update && sudo apt-get install -y musl-tools clang lld

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded Web PWA assets
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Verify formatting, clippy & tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo nextest run --workspace

      - name: Build static musl binary & check size gate
        run: ./scripts/check-binary.sh --require-musl

      - name: Verify daemon RSS budget
        run: ./scripts/bench-rss.sh

      - name: Package release archive & checksums
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          STAGE="dist/latch-${TAG}-x86_64-unknown-linux-musl"
          mkdir -p "$STAGE"
          cp target/x86_64-unknown-linux-musl/release/latch "$STAGE/latch"
          cp LICENSE README.md CHANGELOG.md "$STAGE/"
          tar -C dist -czf "dist/latch-${TAG}-x86_64-unknown-linux-musl.tar.gz" "latch-${TAG}-x86_64-unknown-linux-musl"
          (cd dist && sha256sum "latch-${TAG}-x86_64-unknown-linux-musl.tar.gz" > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ARCHIVE="dist/latch-${TAG}-x86_64-unknown-linux-musl.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              "$ARCHIVE" \
              dist/SHA256SUMS.txt \
              --title "Latch ${TAG}" \
              --generate-notes
          fi

  build-desktop-linux:
    name: Build & Publish Native Desktop App (Linux .AppImage & .deb)
    runs-on: ubuntu-22.04
    needs: [build-musl-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop
          workspaces: desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build frontend web/dist
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Tauri v2 Desktop App (.deb & .AppImage)
        working-directory: desktop
        env:
          NO_STRIP: "true"
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage

      - name: Package & upload Desktop App assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist-desktop
          APPIMAGE="$(find desktop/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)"
          DEB="$(find desktop/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1)"
          [ -f "$APPIMAGE" ] && cp "$APPIMAGE" "dist-desktop/Latch-IDE-${TAG}-x86_64.AppImage"
          [ -f "$DEB" ] && cp "$DEB" "dist-desktop/Latch-IDE-${TAG}-amd64.deb"
          (cd dist-desktop && sha256sum * > DESKTOP-SHA256SUMS.txt)
          ls -lh dist-desktop/
          gh release upload "$TAG" dist-desktop/* --clobber
