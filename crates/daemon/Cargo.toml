[package]
name = "latch-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["ide"]
ide = [
  "dep:latch-agent-proto",
  "dep:latch-fs-service",
  "dep:latch-search",
  "dep:latch-workbench-api",
]
lsp = ["dep:latch-lsp-host"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
latch-agent-proto = { workspace = true, optional = true }
latch-core = { workspace = true }
latch-dag = { workspace = true }
latch-fs-service = { workspace = true, optional = true }
latch-git-engine = { workspace = true }
latch-lsp-host = { workspace = true, optional = true }
latch-proxy = { workspace = true }
latch-pty-pool = { workspace = true }
latch-sandbox = { workspace = true }
latch-search = { workspace = true, optional = true }
latch-store = { workspace = true }
latch-workbench-api = { workspace = true, optional = true }
nix = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
