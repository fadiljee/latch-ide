[package]
name = "latch-desktop"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Tauri v2 desktop shell for Latch IDE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
latch-core = { path = "../crates/core" }
latch-daemon = { path = "../crates/daemon" }
serde_json = "1"
tauri = { version = "2", features = [] }
